    # Keep tooling, build config and source out of the public web root.
    # (The whole repo is COPYd into nginx; these paths must not be served.)
    location ^~ /scripts/ { return 404; }
    location ^~ /deploy/  { return 404; }
    location = /Dockerfile        { return 404; }
    location = /package.json      { return 404; }
    location = /package-lock.json { return 404; }

    # gated preview reel — HTTP Basic Auth (hard gate, server-side)
    location = /reel { return 301 /reel/; }
    location /reel/ {
        auth_basic "natural wine festival a'dam";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/index.html =404;
    }

    # never serve dotfiles (htpasswd etc.), but leave ACME challenges reachable
    location ~ /\.(?!well-known) { deny all; }

    location / { try_files $uri $uri/ =404; }
