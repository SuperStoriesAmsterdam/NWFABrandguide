<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NWFA — studio (everything, one tab)</title>
<style>
  @font-face{font-family:'Figtree';src:url('concept-assets/Figtree.woff2') format('woff2');font-weight:300 800;font-display:swap;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Figtree',system-ui,sans-serif;background:#0e0d0b;display:flex;flex-direction:column;}

  .bar{flex:0 0 auto;background:#161a16;color:#efe9db;display:flex;align-items:center;gap:18px 14px;padding:11px 20px;border-bottom:1px solid #2a2722;flex-wrap:wrap;}
  .brand{font-size:13px;font-weight:700;letter-spacing:.04em;color:#cfc4a4;}
  .grp{display:flex;align-items:center;gap:7px;}
  .grp .gl{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6a6452;margin-right:2px;}
  .tab{appearance:none;border:1px solid #3a3a32;background:transparent;color:#cfc4a4;font-family:inherit;
       font-size:12px;font-weight:600;letter-spacing:.02em;padding:7px 13px;border-radius:100px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .tab:hover{color:#fff;border-color:#6a6452;}
  .tab.active{background:#efe9db;color:#161a16;border-color:#efe9db;}
  .sep{width:1px;align-self:stretch;background:#2a2722;margin:2px 0;}

  .stage{flex:1 1 auto;position:relative;min-height:0;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#b4ae9f;display:none;}
  iframe.active{display:block;}
  .spin{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#6a6452;font-size:13px;letter-spacing:.04em;}
  .spin.on{display:flex;}

  @media(max-width:820px){.brand{width:100%}.grp .gl{display:none}}
</style>
</head>
<body>

  <div class="bar">
    <span class="brand">NWFA · studio</span>

    <div class="grp">
      <span class="gl">home</span>
      <button class="tab active" data-v="home-front" data-src="home-label.html">front door</button>
      <button class="tab" data-v="home-day" data-src="home-day-variants.html">long day</button>
      <button class="tab" data-v="home-concepts" data-src="concepts-home.html">home concepts</button>
      <button class="tab" data-v="inner" data-src="concepts-systems.html">inner pages</button>
    </div>

    <div class="sep"></div>

    <div class="grp">
      <span class="gl">social</span>
      <button class="tab" data-v="s1" data-src="social-system.html">refined</button>
      <button class="tab" data-v="sroutes" data-src="social-routes.html">5 routes</button>
      <button class="tab" data-v="sbrown" data-src="social-system-brown.html">brown</button>
      <button class="tab" data-v="slabel" data-src="social-label.html">label</button>
    </div>

    <div class="sep"></div>

    <div class="grp">
      <span class="gl">brand</span>
      <button class="tab" data-v="dirs" data-src="index.html">directions</button>
    </div>
  </div>

  <div class="stage">
    <div class="spin" id="spin">loading…</div>
    <iframe data-v="home-front" title="front door"></iframe>
    <iframe data-v="home-concepts" title="home concepts"></iframe>
    <iframe data-v="inner" title="inner pages"></iframe>
    <iframe data-v="home-day" title="home long day"></iframe>
    <iframe data-v="s1" title="social refined"></iframe>
    <iframe data-v="sroutes" title="social routes"></iframe>
    <iframe data-v="sbrown" title="social brown"></iframe>
    <iframe data-v="slabel" title="social label"></iframe>
    <iframe data-v="dirs" title="brand directions"></iframe>
  </div>

  <script>
    const tabs = [...document.querySelectorAll('.tab')];
    const frames = {};
    document.querySelectorAll('iframe').forEach(f => frames[f.dataset.v] = f);
    const spin = document.getElementById('spin');

    function show(v){
      tabs.forEach(t => t.classList.toggle('active', t.dataset.v === v));
      Object.values(frames).forEach(f => f.classList.toggle('active', f.dataset.v === v));
      const f = frames[v];
      if (f && !f.getAttribute('src')) {              // lazy-load on first view
        spin.classList.add('on');
        f.addEventListener('load', () => spin.classList.remove('on'), { once:true });
        f.setAttribute('src', f.dataset.src);
      }
    }
    tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.v)));
    show('home-front');   // default
  </script>

</body>
</html>
