<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NWFA Tasting Reel</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap">
<style>
  :root{
    --bg:#ECE6D6; --ink:#1B3326; --ink-2:#3c5345; --amber:#eeba3f; --ochre:#9F6E29;
    --sans:'Figtree',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
    padding-block:4vh;
    background-image:radial-gradient(rgba(27,51,38,.045) 1px,transparent 1px);
    background-size:5px 5px;
  }
  .player{width:100%;max-width:min(420px,calc((100vh - 14vh) * 0.5625));
    display:flex;flex-direction:column;gap:14px;align-items:center}
  .player video{width:100%;aspect-ratio:9/16;border-radius:16px;background:#15281d;
    box-shadow:0 18px 50px rgba(27,51,38,.2);display:block}
  .meta{display:flex;align-items:center;gap:10px;align-self:stretch;padding:0 2px}
  .meta svg{width:30px;height:30px;display:block;flex:none}
  .meta .t{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-2);line-height:1.3}
  .meta .ex{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ochre)}
</style>
</head>
<body>
  <main class="player">
    <video controls playsinline preload="metadata" src="tasting-flow-reel.mp4"></video>
    <div class="meta">
      <svg viewBox="0 0 261.44 261.44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle fill="none" stroke="#1B3326" stroke-width="12" cx="130.72" cy="130.72" r="124"/>
        <circle fill="#eeba3f" cx="130.72" cy="130.72" r="9"/>
      </svg>
      <span class="t">natural wine<br>festival a'dam</span>
      <span class="ex">example · fictional</span>
    </div>
  </main>
</body>
</html>
